[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eigengrooves"
version = "2.0.0"
description = "Music recommendation by latent audio-feature analysis, with a from-scratch SVD"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "smparc" }]
keywords = ["svd", "recommender-systems", "linear-algebra", "music-information-retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "seaborn>=0.12"]
notebook = ["matplotlib>=3.7", "seaborn>=0.12", "jupyter>=1.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "matplotlib>=3.7",
]

[project.scripts]
eigengrooves = "eigengrooves.cli:main"

[project.urls]
Homepage = "https://github.com/smparc/eigengrooves"
Issues = "https://github.com/smparc/eigengrooves/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running tests, deselect with -m 'not slow'"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B905",    # zip(strict=) is 3.10+, kept optional for readability
    # This project deliberately handles ambiguous Unicode (the check mark,
    # sigma and minus sign that crashed v1 on a cp1252 console). Flagging them
    # as "did you mean ASCII?" is exactly backwards here.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"notebooks/*" = ["E402", "E702", "F401", "I001"]

[tool.mypy]
files = ["src/eigengrooves"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
source = ["eigengrooves"]
branch = true
