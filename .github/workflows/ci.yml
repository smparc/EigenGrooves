name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q --cov=eigengrooves --cov-report=term-missing

      # The bug that made v1 unrunnable was an encoding crash, so the suite is
      # also run under a legacy Windows code page. Without this the regression
      # would pass CI on a UTF-8 runner and still break on a real desktop.
      - name: Test under legacy code page (Windows)
        if: runner.os == 'Windows'
        env:
          PYTHONIOENCODING: cp1252
        run: pytest -q

      - name: Smoke test the CLI
        run: |
          python main.py recommend --synthetic --synthetic-songs 500 -n 5 --explain
          python main.py analyze --synthetic --synthetic-songs 500
          python main.py evaluate --synthetic --synthetic-songs 500 --max-groups 20 --min-group-size 5

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy
