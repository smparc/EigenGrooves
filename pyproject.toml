[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eigengrooves"
version = "2.0.0"
description = "Music recommendation by latent audio-feature analysis, with a from-scratch SVD"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "smparc" }]
keywords = ["svd", "recommender-systems", "linear-algebra", "music-information-retrieval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "seaborn>=0.12"]
notebook = ["matplotlib>=3.7", "seaborn>=0.12", "jupyter>=1.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "matplotlib>=3.7",
]

[project.scripts]
eigengrooves = "eigengrooves.cli:main"

[project.urls]
Homepage = "https://github.com/smparc/eigengrooves"
Issues = "https://github.com/smparc/eigengrooves/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running tests, deselect with -m 'not slow'"]
filterwarnings = [
    # Promote RuntimeWarnings to errors: in numerical code they almost always
    # mean an overflow, a divide-by-zero or a NaN we should have handled.
    "error::RuntimeWarning",
    # ...with one exception we do not control. Some BLAS backends (notably
    # Apple's Accelerate, used by default on macOS) leave the floating-point
    # "invalid" status flag set after a matmul even when every element of the
    # result is finite. NumPy reports that flag, so `A.T @ A` on a small matrix
    # can warn despite being numerically perfect.
    #
    # This is safe to ignore *here* because it cannot hide a real NaN: the
    # assertions that would be affected compare against an expected value, and
    # `np.allclose` returns False for NaN. `test_factors_are_finite` also
    # checks finiteness explicitly across every shape and backend, so a genuine
    # NaN fails loudly rather than silently.
    "ignore:invalid value encountered in matmul:RuntimeWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B905",    # zip(strict=) is 3.10+, kept optional for readability
    # This project deliberately handles ambiguous Unicode (the check mark,
    # sigma and minus sign that crashed v1 on a cp1252 console). Flagging them
    # as "did you mean ASCII?" is exactly backwards here.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"notebooks/*" = ["E402", "E702", "F401", "I001"]

[tool.mypy]
files = ["src/eigengrooves"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
source = ["eigengrooves"]
branch = true
